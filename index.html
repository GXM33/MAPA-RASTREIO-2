<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Trajeto ao Vivo - Policial</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 65vh; width: 100%; }
    .btn { margin: 4px; }
    #controles, #historico, #favoritos { margin: 10px 0; }
    #status { font-weight: bold; margin-left: 8px; }
  </style>
</head>
<body>
<h2>Rastreamento Policial ao Vivo</h2>
<div id="map"></div>
<div id="controles">
  <input type="text" id="busca" placeholder="Rua e número" autocomplete="off">
  <div id="suggestions"></div>
  <button class="btn" id="btnBuscar">Buscar</button>
  <button class="btn" id="btnLimparBusca">Limpar Busca</button>
  <button class="btn" id="btnAtual">Ir para Localização Atual</button>
  <button class="btn" id="btnIniciar">Iniciar</button>
  <button class="btn" id="btnParar">Parar</button>
  <button class="btn" id="btnExportarImg">Exportar Imagem</button>
  <button class="btn" id="btnExportarCSV">Exportar Coordenadas</button>
  <span id="status"></span>
</div>
<div id="favoritos"><h3>Favoritos:</h3></div>
<div id="historico"><h3>Histórico:</h3></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>
<script>
let map = L.map('map').setView([-30.033, -51.220], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marcadorAtual, marcadorBusca, polyline, isTracking = false, watchId = null, pathLatLngs = [];

// Função para localização inicial automática
function atualizarLocalizacao() {
  navigator.geolocation.getCurrentPosition(pos => {
    let latlng = [pos.coords.latitude, pos.coords.longitude];
    if (!marcadorAtual) {
      marcadorAtual = L.marker(latlng, {title:"Você"}).addTo(map);
    } else {
      marcadorAtual.setLatLng(latlng);
    }
    map.setView(latlng,18);
    document.getElementById('status').innerText = "Localização pronta";
  }, () => { document.getElementById('status').innerText = "Falha ao obter localização"; }, {
    enableHighAccuracy: true, maximumAge: 0
  });
}
atualizarLocalizacao();

// Rastreamento ao vivo
function iniciarRastreamento() {
  if (isTracking) return;
  isTracking = true;
  pathLatLngs = [];
  if (polyline) map.removeLayer(polyline);
  document.getElementById('status').innerText = "Rastreamento: Ativo";
  watchId = navigator.geolocation.watchPosition(pos => {
    let latlng = [pos.coords.latitude, pos.coords.longitude];
    if (!marcadorAtual) {
      marcadorAtual = L.marker(latlng, {title:"Você"}).addTo(map);
    } else {
      marcadorAtual.setLatLng(latlng);
    }
    pathLatLngs.push(latlng);
    if (polyline) polyline.addLatLng(latlng);
    else polyline = L.polyline([latlng], {color: 'blue'}).addTo(map);
  }, () => {
    document.getElementById('status').innerText = "Erro no rastreamento";
  }, {enableHighAccuracy:true, maximumAge:0, timeout:5000});
}

function pararRastreamento() {
  if (!isTracking) return;
  isTracking = false;
  navigator.geolocation.clearWatch(watchId);
  document.getElementById('status').innerText = "Rastreamento: Parado";
  // Salva histórico (simples): array de trajetos
  let historico = JSON.parse(localStorage.getItem('historicoTrajetos') || '[]');
  historico.push(polyline.getLatLngs());
  localStorage.setItem('historicoTrajetos', JSON.stringify(historico));
  desenharHistorico();
}

// Histórico: desenha e exclui individualmente
function desenharHistorico() {
  let histDiv = document.getElementById('historico');
  histDiv.innerHTML = "<h3>Histórico:</h3>";
  let historico = JSON.parse(localStorage.getItem('historicoTrajetos')||'[]');
  historico.forEach((traj, i) => {
    let el = document.createElement('div');
    el.innerHTML = `Trajeto #${i+1} <button onclick="verTrajeto(${i})">Ver</button> <button onclick="deletarTrajeto(${i})">Excluir</button>`;
    histDiv.appendChild(el);
  });
}
window.verTrajeto = function(i) {
  let historico = JSON.parse(localStorage.getItem('historicoTrajetos')||'[]');
  if (polyline) map.removeLayer(polyline);
  polyline = L.polyline(historico[i], {color:'green'}).addTo(map);
}
window.deletarTrajeto = function(i) {
  let historico = JSON.parse(localStorage.getItem('historicoTrajetos')||'[]');
  historico.splice(i,1);
  localStorage.setItem('historicoTrajetos', JSON.stringify(historico));
  desenharHistorico();
}

// Exportar imagem do mapa
document.getElementById('btnExportarImg').onclick = function(){
  leafletImage(map, function(img) {
    let link = document.createElement('a');
    link.href = img.toDataURL();
    link.download = "trajeto.png";
    link.click();
  });
};
// Exportar coordenadas CSV
document.getElementById('btnExportarCSV').onclick = function(){
  let coords = polyline ? polyline.getLatLngs() : [];
  let csv = 'lat,lng\n'+coords.map(p=>`${p.lat},${p.lng}`).join('\n');
  let blob = new Blob([csv],{type:'text/csv'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = "trajeto.csv";
  a.click();
};

// Favoritos: salvar, mostrar, ir
let favoritos = JSON.parse(localStorage.getItem('favoritosMap')||'[]');
function desenharFavoritos() {
  let favDiv = document.getElementById('favoritos');
  favDiv.innerHTML = "<h3>Favoritos:</h3>";
  favoritos.forEach((fav, i) => {
    let el = document.createElement('div');
    el.innerHTML = `${fav.nome} <button onclick="navegarFavorito(${i})">Ir</button> <button onclick="removerFavorito(${i})">Excluir</button>`;
    favDiv.appendChild(el);
    L.marker([fav.lat,fav.lng],{title:"Favorito"}).addTo(map);
  });
}
window.navegarFavorito = function(i){
  let fav = favoritos[i];
  map.setView([fav.lat,fav.lng],18);
  // Traçar rota atual->favorito (simples, retas)
  if (marcadorAtual) {
    if (polyline) map.removeLayer(polyline);
    polyline = L.polyline([marcadorAtual.getLatLng(),[fav.lat,fav.lng]],{color:'red'}).addTo(map);
  }
}
window.removerFavorito = function(i){
  favoritos.splice(i,1); localStorage.setItem('favoritosMap',JSON.stringify(favoritos)); desenharFavoritos();
}

// Buscar endereço + autocomplete
document.getElementById('busca').addEventListener('input',function(e){
  let query = e.target.value;
  if (query.length<3) return;
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
    .then(r=>r.json()).then(res=>{
      let sugDiv = document.getElementById('suggestions');
      sugDiv.innerHTML = '';
      res.slice(0,5).forEach(s=>{
        let el = document.createElement('div');
        el.innerText = s.display_name;
        el.onclick = ()=>{e.target.value=s.display_name; sugDiv.innerHTML = ''; };
        sugDiv.appendChild(el);
      });
    });
});
document.getElementById('btnBuscar').onclick = function(){
  let query = document.getElementById('busca').value;
  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
    .then(r=>r.json()).then(res=>{
      if(res.length>0){
        let s = res[0];
        let latlng = [parseFloat(s.lat), parseFloat(s.lon)];
        if(marcadorBusca) map.removeLayer(marcadorBusca);
        marcadorBusca = L.marker(latlng,{title:"Busca"}).addTo(map);
        map.setView(latlng,18);
        favoritos.push({nome:s.display_name,lat:latlng[0],lng:latlng[1]});
        localStorage.setItem('favoritosMap',JSON.stringify(favoritos));
        desenharFavoritos();
      } else {
        document.getElementById('status').innerText = "Endereço não encontrado";
      }
    });
};
document.getElementById('btnLimparBusca').onclick = function(){
  document.getElementById('busca').value='';
  document.getElementById('suggestions').innerHTML = '';
  if(marcadorBusca) map.removeLayer(marcadorBusca);
};
document.getElementById('btnAtual').onclick = atualizarLocalizacao;
document.getElementById('btnIniciar').onclick = function(){
  if (confirm("Ativar rastreamento ao vivo e compartilhar localização?")) iniciarRastreamento();
};
document.getElementById('btnParar').onclick = pararRastreamento;

desenharHistorico();
desenharFavoritos();

</script>
</body>
</html>
