<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de rota em tempo real</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 280px;
            padding: 16px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar h1 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .sidebar small {
            color: #666;
            font-size: 12px;
        }

        .status-box {
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .status-tracking {
            background-color: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #90caf9;
        }

        .status-info {
            background-color: #f5f5f5;
            color: #424242;
            border: 1px solid #e0e0e0;
        }

        .datetime {
            font-size: 12px;
            color: #555;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 10px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #btnStart {
            background-color: #4caf50;
            color: #fff;
        }
        #btnStart:hover {
            background-color: #43a047;
        }

        #btnStop {
            background-color: #f44336;
            color: #fff;
        }
        #btnStop:hover {
            background-color: #e53935;
        }

        #btnClear {
            background-color: #ff9800;
            color: #fff;
        }
        #btnClear:hover {
            background-color: #fb8c00;
        }

        #map {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div>
            <h1>🗺️ Rastreador</h1>
            <small>Enquanto o rastreamento estiver ativo, o mapa vai traçando a rota do seu deslocamento.</small>
        </div>

        <div class="status-box status-tracking" id="trackingStatus">
            Rastreamento: <strong>Parado</strong>
        </div>

        <div class="status-box status-info" id="infoStatus">
            Aguardando ações...
        </div>

        <div class="datetime">
            Data/hora (Brasília): <span id="currentDateTime"></span>
        </div>

        <div class="buttons">
            <button id="btnStart">Iniciar rastreamento</button>
            <button id="btnStop">Parar rastreamento</button>
            <button id="btnClear">Limpar rota</button>
        </div>
    </div>

    <div id="map"></div>
</div>

<!-- Google Maps SEM chave na URL (como você pediu).
     Se no seu projeto o Maps já é carregado de outro jeito, remova esta linha. -->
<script src="https://maps.googleapis.com/maps/api/js"></script>

<script>
    let map;
    let polyline;           // Linha que representa a rota
    let path = [];          // Array de coordenadas {lat, lng}
    let watchId = null;     // ID do watchPosition
    let currentMarker = null;

    const trackingStatusEl = document.getElementById('trackingStatus');
    const infoStatusEl = document.getElementById('infoStatus');
    const dateTimeEl = document.getElementById('currentDateTime');

    // Atualiza data/hora em horário de Brasília
    function updateDateTime() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('pt-BR', {
            timeZone: 'America/Sao_Paulo',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        dateTimeEl.textContent = formatter.format(now);
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    // Inicializa o mapa
    function initMap() {
        const initialCenter = { lat: -30.0346, lng: -51.2177 }; // Porto Alegre como fallback

        map = new google.maps.Map(document.getElementById('map'), {
            center: initialCenter,
            zoom: 15,
            mapTypeControl: false,
            fullscreenControl: true,
            zoomControl: true,
            streetViewControl: false
        });

        // Tenta centralizar na localização atual assim que abre
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    map.setCenter(pos);
                    addCurrentMarker(pos);
                },
                () => {
                    setInfo('Não foi possível obter a localização inicial (permissão negada ou erro).');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            setInfo('Este navegador não suporta geolocalização.');
        }
    }

    // Atualiza caixa de status de rastreamento
    function setTrackingActive(active) {
        if (active) {
            trackingStatusEl.innerHTML = 'Rastreamento: <strong>Ativo</strong>';
        } else {
            trackingStatusEl.innerHTML = 'Rastreamento: <strong>Parado</strong>';
        }
    }

    // Atualiza caixa de informações
    function setInfo(msg) {
        infoStatusEl.textContent = msg;
    }

    // Adiciona ou move o marcador da posição atual
    function addCurrentMarker(position) {
        if (!map) return;

        if (!currentMarker) {
            currentMarker = new google.maps.Marker({
                map,
                position,
                title: 'Sua posição atual'
            });
        } else {
            currentMarker.setPosition(position);
        }
    }

    // Inicia o rastreamento (watchPosition)
    function startTracking() {
        if (!navigator.geolocation) {
            setInfo('Geolocalização não suportada pelo navegador.');
            return;
        }

        // Se já está rastreando, não faz nada
        if (watchId !== null) {
            setInfo('Rastreamento já está ativo.');
            return;
        }

        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const pos = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };

                // Atualiza marcador atual
                addCurrentMarker(pos);

                // Adiciona ponto ao caminho
                path.push(pos);

                // Se a polyline ainda não existe, cria
                if (!polyline) {
                    polyline = new google.maps.Polyline({
                        map,
                        path: path,
                        geodesic: true,
                        strokeColor: '#ff0000',
                        strokeOpacity: 0.9,
                        strokeWeight: 4
                    });
                } else {
                    polyline.setPath(path);
                }

                // Centraliza suavemente no ponto atual
                map.panTo(pos);

                setInfo('Rastreamento em andamento. Pontos na rota: ' + path.length);
                setTrackingActive(true);
            },
            (error) => {
                let msg = 'Erro ao rastrear localização.';
                if (error.code === error.PERMISSION_DENIED) {
                    msg = 'Permissão de localização negada.';
                } else if (error.code === error.POSITION_UNAVAILABLE) {
                    msg = 'Localização indisponível.';
                } else if (error.code === error.TIMEOUT) {
                    msg = 'Tempo esgotado ao obter localização.';
                }
                setInfo('❌ ' + msg);
                stopTracking();
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );

        setInfo('Iniciando rastreamento...');
        setTrackingActive(true);
    }

    // Para o rastreamento
    function stopTracking() {
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        setTrackingActive(false);
        setInfo('Rastreamento parado. A rota permanece desenhada até você limpar.');
    }

    // Limpa a rota do mapa (polyline) e zera o caminho
    function clearRoute() {
        if (polyline) {
            polyline.setMap(null);
            polyline = null;
        }
        path = [];
        setInfo('Rota limpa do mapa. Você pode iniciar um novo rastreamento.');
    }

    // Liga os botões
    document.getElementById('btnStart').addEventListener('click', startTracking);
    document.getElementById('btnStop').addEventListener('click', stopTracking);
    document.getElementById('btnClear').addEventListener('click', clearRoute);

    // Inicializa o mapa ao carregar a página
    window.addEventListener('load', () => {
        if (window.google && google.maps) {
            initMap();
        } else {
            setInfo('❌ Biblioteca Google Maps não carregada.');
        }
    });
</script>
</body>
</html>
